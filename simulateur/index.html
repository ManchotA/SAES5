<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulateur du boîtier</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #15171c;
      }

      main {
        width: min(560px, calc(100% - 32px));
        padding: 24px 0;
      }
    </style>
  </head>
  <body>
    <!-- Page seule du simulateur, pratique sur un deuxième écran.
         Le même boîtier existe aussi dans le jeu, derrière une icône (widget.js). -->
    <main id="simulateur"></main>
    <script type="module">
      import { creerSimulateur } from '/simulateur/simulateur.js';

      const reglages = await fetch('/simulateur/reglages.json')
        .then((reponse) => reponse.json())
        .catch(() => ({}));
      creerSimulateur(document.getElementById('simulateur'), {
        outilsDeTest: Boolean(reglages.outils_de_test),
      }).activer();
    </script>
  </body>
</html>
